<!--
  admin-list.html — SOLUTION Lab 3 G2
  Search + lista + paginazione. Stato in URL (no ngModel locale).
-->

<div class="space-y-4">

  <header class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">Prodotti (admin)</h1>
  </header>

  <!-- ✅ Search: lettura da signal q(), scrittura via onSearch → router.navigate -->
  <input
    type="text"
    [value]="q()"
    (input)="onSearch($any($event.target).value)"
    placeholder="Cerca prodotto…"
    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
  />

  <!-- ✅ Lista paginata -->
  @for (p of pagedProducts(); track p.id) {
    <div class="border border-gray-200 rounded-lg p-4 flex justify-between items-center bg-white">
      <div>
        <strong class="text-gray-900">{{ p.name }}</strong>
        <span class="text-gray-500 text-sm">
          — {{ p.category }} — {{ p.price | currency:'EUR':'symbol':'1.0-0' }}
        </span>
      </div>
      <!-- ✅ routerLink relativo: da /admin/products a /admin/products/:id/edit -->
      <a [routerLink]="[p.id, 'edit']"
         class="text-teal-700 hover:underline text-sm font-medium">
        Modifica
      </a>
    </div>
  } @empty {
    <p class="text-gray-400 italic">Nessun prodotto trovato per "{{ q() }}".</p>
  }

  <!-- ✅ Paginazione -->
  <div class="flex justify-between items-center pt-4 border-t border-gray-100">
    <button
      type="button"
      (click)="goToPage(page() - 1)"
      [disabled]="page() <= 1"
      class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed"
    >
      ← Indietro
    </button>
    <span class="text-sm text-gray-500">
      Pagina {{ page() }} di {{ totalPages() }}
    </span>
    <button
      type="button"
      (click)="goToPage(page() + 1)"
      [disabled]="page() >= totalPages()"
      class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed"
    >
      Avanti →
    </button>
  </div>

</div>
