<!--
  PRODUCT CARD — SOLUZIONE Lab 05
  Invariata rispetto al Lab 04: mostra il prodotto, emette addToCart.
-->
<div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 hover:shadow-lg transition-shadow"
  [ngClass]="{
  'border-gray-100 hover:shadow-lg': product.available,
  'border-red-200 border-4 bg-red-50 opacity-40': !product.available
}">

  <!-- IMMAGINE placeholder -->
  <div class="bg-gradient-to-br from-gray-100 to-gray-200 h-40 flex items-center justify-center">
    <span class="text-5xl">📦</span>
  </div>

  <div class="p-4">
    <span class="text-xs font-medium bg-teal-100 text-teal-700 px-2 py-0.5 rounded-full">
      {{ product.category }}
    </span>

    <h3 class="font-semibold text-gray-800 mt-2 text-sm leading-tight">
      {{ product.name }}
    </h3>

    <p class="text-xs text-gray-500 mt-1 line-clamp-2">{{ product.description }}</p>

    <div class="flex items-center justify-between mt-3">
      <span class="font-bold text-teal-700 text-lg">
        {{ product.price | currency:'EUR':'symbol':'1.1-1'}}
      </span>

      @if (product.available) {
      <button (click)="onAddToCart()"
        class="text-xs bg-teal-600 hover:bg-teal-700 text-white px-3 py-1.5 rounded-lg transition-colors font-medium">
        + Aggiungi
      </button>
      } @else {
      <span class="text-xs text-gray-400 italic">Non disponibile</span>
      }
    </div>
  </div>
</div>
