<!--
  NOT FOUND PAGE — Template 404

  Mostrata automaticamente dal Router per qualsiasi URL non riconosciuto.
  Configurata con path '**' in app.routes.ts.

  Offre due link di uscita:
  - Torna alla Home  → /home
  - Vai al Catalogo  → /catalog
-->
<div class="max-w-6xl mx-auto px-4 py-20 text-center">

  <!-- Numero 404 grande come elemento visivo (non testuale) -->
  <p class="text-9xl font-bold text-gray-100 mb-4 select-none leading-none">
    404
  </p>

  <h1 class="text-2xl font-bold text-gray-700 mb-2">
    Pagina non trovata
  </h1>

  <p class="text-gray-400 mb-8 max-w-md mx-auto">
    L'URL richiesto non corrisponde a nessuna pagina dell'applicazione.
    Usa i link qui sotto per tornare a una sezione valida.
  </p>

  <div class="flex gap-3 justify-center flex-wrap">

    <!--
      [routerLink]="['/home']" → naviga a /home senza reload.
      Il Router intercetta il click, aggiorna l'URL e carica HomePage
      nel <router-outlet>.
    -->
    <a
      [routerLink]="['/home']"
      class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-sm
             transition-colors font-medium"
    >
      Torna alla Home
    </a>

    <a
      [routerLink]="['/catalog']"
      class="px-5 py-2 bg-white border border-gray-300 hover:border-teal-400
             text-gray-700 rounded-lg text-sm transition-colors font-medium"
    >
      Vai al Catalogo
    </a>

  </div>

</div>
